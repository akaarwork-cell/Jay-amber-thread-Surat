function makeOrders(){

 for(let i=0;i<160;i++){
   const c=customers[i%customers.length], p1=products[(i*7)%products.length], p2=products[(i*13+3)%products.length];

   const amount=Math.round((p1.price*q1+(q2?p2.price*q2:0))*1.05/10)*10;
   const st=i%17===0?"Returned":i%23===0?"Cancelled":statuses[i%6];
   const date=dateFrom(i%180);
   const o={id:`ORD-${String(1024+i).padStart(4,"0")}`,invoice:`JAT/26-27/${String(5001+i)}`,
    date,customerId:c.id,customer:c.name,city:c.city,phone:c.phone,
    items:[{productId:p1.id,name:p1.name,qty:q1,price:p1.price},{...(q2?[{productId:p2.id,name:p2.name,qty:q2,price:p2.price}]:[])],
    subtotal:amount,discount:i%6===0?Math.round(amount*.05):0,shipping:0,total:amount-(i%6===0?Math.round(amount*.05):0),
    payment:payments[i%payments.length],paymentStatus:(i%11===0?"Pending":"Paid"),status:st,
    timeline:["Order placed","Confirmed","Processing","Packed","Shipped","Delivered"].slice(0,Math.max(1,(statuses.indexOf(st)+1))).map((x,j)=>({label:x,date:date}))
   };
   arr.push(o);
   c.orders++; c.spent+=o.total; c.lastOrder=date;
 }
 return arr;
}

].map(v=>`<div class="value"><div class="valueIcon">${icon("check",17)}</div><h3>${v[0]}</h3><p>${v[1]}</p></div>`).join("")}</div></div><div class="storyCard"><img src="${shopImg}" alt="Jay Ambe Threads store"><div class="storyOverlay"><div class="kicker">Supplied brand image</div><h3>Real storefront. Digital storefront.</h3><p>Used as the visual source of truth for the shop environment in this demo.</p></div></div></div></section><section class="section" style="padding-top:10px"><div class="container"><div class="ctaBand"><div><div class="kicker" style="color:#6e531b">Owner perspective</div><h2>“Make every repeat order easier than the last.”</h2><p>Demo business philosophy — replace with the owner's verified story and quote.</p></div><div style="width:70px;height:70px;border-radius:50%;background:#efe0b9;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:23px">JA</div></div></div></section></main>`}
function contactPage(){return `<main class="section"><div class="container"><div class="kicker">Contact & assistance</div><h1 style="font-family:var(--display);font-size:48px;letter-spacing:-.055em;margin:8px 0">Let's solve your next thread requirement.</h1><p style="color:var(--muted);max-width:650px">Use the demo form to simulate a wholesale enquiry. In production, this can connect to WhatsApp, CRM, email or the owner dashboard.</p><div class="split" style="margin-top:28px"><div class="panel"><h3 style="font-family:var(--display)">Business details</h3><p><b>Jay Ambe Threads</b><br>${BRAND.address}</p><p>Customer rating: <b>${BRAND.rating} ★</b> (${BRAND.reviews} reviews)</p><button class="btn primary" onclick="window.open('https://wa.me/91${BRAND.whatsapp}','_blank')">${icon("phone",16)} WhatsApp / Call</button></div><div class="panel"><h3 style="font-family:var(--display)">Wholesale enquiry</h3><div class="formGrid"><div class="field"><label>NAME</label><input id="enqName" placeholder="Your name"></div><div class="field"><label>MOBILE</label><input id="enqPhone" placeholder="10-digit mobile"></div><div class="field full"><label>REQUIREMENT</label><textarea id="enqReq" rows="5" placeholder="Tell us product, colour, quantity or SKU"></textarea></div></div><button class="btn gold" style="margin-top:14px" onclick="submitEnquiry()">Send enquiry</button></div></div></div></main>`}
function trackPage(){return `<main class="section"><div class="container" style="max-width:850px"><div class="kicker">Order tracking</div><h1 style="font-family:var(--display);font-size:48px;letter-spacing:-.055em;margin:8px 0">Where is my order?</h1><p style="color:var(--muted)">Enter a demo order number such as <b>ORD-1024</b> or use any order generated in this prototype.</p><div class="panel" style="margin-top:25px"><div class="formGrid"><div class="field"><label>ORDER NUMBER</label><input id="trackOrder" placeholder="ORD-1024"></div><div class="field"><label>MOBILE NUMBER</label><input id="trackPhone" placeholder="90313625844"></div></div><button class="btn primary" style="margin-top:14px" onclick="trackOrder()">Track order ${icon("arrow",15)}</button></div><div id="trackResult"></div></div></main>`}

function footer(){return `<footer class="footer"><div class="container"><div class="footerGrid"><div><div class="brand" style="color:#fff"><span class="logoMark"></span><span class="brandText">JAY AMBE<small>THREADS • YARNS WHOLESALER</small></span></div><p style="max-width:300px;margin-top:17px">A premium digital commerce demo tailored to the visible Jay Ambe Threads business identity and Surat wholesale context.</p></div><div><b>Shop</b><a onclick="goCustomer('shop')">All products</a><a onclick="goCustomer('categories')">Categories</a><a onclick="goCustomer('best')">Best sellers</a></div><div><b>Support</b><a onclick="goCustomer('track')">Track order</a><a onclick="goCustomer('contact')">Wholesale enquiry</a><a onclick="openCart()">Cart</a></div><div><b>Business</b><p>${BRAND.address}</p><a onclick="window.open('https://wa.me/91${BRAND.whatsapp}','_blank')">WhatsApp</a><a onclick="switchRoute('owner')">Owner dashboard</a></div></div><div class="footerBottom"><span>© 2026 Jay Ambe Threads • Demo prototype</span><span>Privacy • Terms • Shipping • Returns</span></div></div></footer>`}

function customerApp(){
 let page=state.customerPage;
 let content=page==="home"?homePage():page==="shop"?shopPage(false):page==="best"?shopPage(true):page==="categories"?categoriesPage():page==="about"?aboutPage():page==="contact"?contactPage():trackPage();
 return `<div class="customer active">${customerHeader()}${content}${footer()}${mobileBottom()}</div>`
}

function ownerSidebar(){
 const items=[
  ["dashboard","Dashboard", "chart"],["orders","Orders","box"],["sales","Sales & invoices","chart"],["customers","Customers","users"],["products","Products","box"],["inventory","Inventory","box"],["categories","Categories","settings"],["reports","Reports","file"]
 ];
 return `<aside class="side"><div class="sideBrand"><span class="logoMark"></span><span class="brandText">JAY AMBE<small>OWNER CONSOLE</small></span></div><div class="sideNav">${items.map(x=>`<button class="${state.ownerPage===x[0]?'active':''}" onclick="goOwner('${x[0]}')">${icon(x[2],17)}<span>${x[1]}</span></button>`).join("")}</div><div class="sideSection">Demo</div><div class="sideNav"><button onclick="switchRoute('customer')">${icon("home",17)}<span>Customer site</span></button><button onclick="resetDemo()">${icon("settings",17)}<span>Reset demo data</span></button></div></aside>`
}
function ownerHeader(){
 const titles={dashboard:["Dashboard","Executive view of sales, orders, customers and stock"],orders:["Orders","Manage fulfilment and order status"],sales:["Sales & invoices","Revenue, invoice history and payment status"],customers:["Customers","Lightweight wholesale CRM"],products:["Products","Catalogue and pricing management"],inventory:["Inventory","Stock health and movement"],categories:["Categories","Category-level sales and inventory"],reports:["Reports","Exportable business reporting"]};
 const t=titles[state.ownerPage]||titles.dashboard;
 return `<div class="ownerTop"><div class="ownerTitle"><h1>${t[0]}</h1><p>${t[1]}</p></div><div class="ownerActions"><button class="iconBtn" onclick="showNotifications()">${icon("bell",17)}<span class="badge">3</span></button><button class="btn small ghost" onclick="switchRoute('customer')">Customer site</button><button class="btn small primary" onclick="demoLogout()">${icon("logout",14)} Demo logout</button></div></div>`
}
function ownerApp(){
 return `<div class="owner active"><div class="ownerShell">${ownerSidebar()}<section class="ownerMain">${ownerHeader()}<div class="ownerContent">${ownerContent()}</div></section></div><div class="mobileBottom" style="background:#14171c"><button onclick="goOwner('dashboard')">${icon("chart",16)}Home</button><button onclick="goOwner('orders')">${icon("box",16)}Orders</button><button onclick="goOwner('customers')">${icon("users",16)}CRM</button><button onclick="goOwner('products')">${icon("box",16)}Products</button><button onclick="switchRoute('customer')">${icon("home",16)}Store</button></div></div>`
}
function kpi(label,val,foot,page){return `<div class="kpi" onclick="${page?`goOwner('${page}')`:""}"><div class="kpiLabel">${label}</div><div class="kpiValue">${val}</div><div class="kpiFoot">${foot}</div></div>`}
function calcSales(list){return list.reduce((a,o)=>a+o.total,0)}
function dashboard(){
 const sales=calcSales(orders.filter(o=>o.status!=="Cancelled"&&o.status!=="Returned"));
 const pending=orders.filter(o=>["New","Confirmed","Processing","Packed"].includes(o.status)).length;
 const low=products.filter(p=>p.stock<50).length;
 const avg=Math.round(sales/Math.max(1,orders.filter(o=>o.status!=="Cancelled").length));
 return `<div class="kpiGrid">${kpi("Total sales",money(sales),"All-time demo sales","sales")}${kpi("Orders",orders.length,"Lifetime order records","orders")}${kpi("Customers",customers.length,"Wholesale accounts","customers")}${kpi("Pending orders",pending,"Needs fulfilment","orders")}${kpi("Products",products.length,"Catalogue SKUs","products")}${kpi("Low stock",low,"Products under 50 units","inventory")}${kpi("Avg. order value",money(avg),"Across non-cancelled orders","sales")}${kpi("Returns",orders.filter(o=>o.status==="Returned").length,"Returned orders","orders")}</div>
 <div class="dashGrid"><div class="panel"><div class="panelHead"><h3>Revenue performance</h3><select class="select" onchange="updateDashChart(this.value)"><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="180">Last 6 months</option></select></div><div class="chartWrap"><canvas id="revenueChart"></canvas></div></div>
 <div class="panel"><div class="panelHead"><h3>Category mix</h3></div><div class="chartWrap"><canvas id="categoryChart"></canvas></div></div></div>
 <div class="dashGrid"><div class="panel"><div class="panelHead"><h3>Recent orders</h3><button class="btn small ghost" onclick="goOwner('orders')">View all</button></div>${orders.slice(0,7).map(orderRow).join("")}</div>
 <div class="panel"><div class="panelHead"><h3>Stock attention</h3><button class="btn small ghost" onclick="goOwner('inventory')">Inventory</button></div>${products.filter(p=>p.stock<70).slice(0,7).map(p=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f1f3"><span style="font-size:12px">${p.name.slice(0,32)}...</span><b style="color:${p.stock<30?'#a33':'#986d20'}">${p.stock} ${p.unit}s</b></div>`).join("")}</div></div>`
}
function orderRow(o){return `<div class="clickable" onclick="openOrder('${o.id}')" style="display:grid;grid-template-columns:1.2fr 1.5fr 1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f3;align-items:center"><b style="font-size:11px">${o.id}</b><span style="font-size:11px">${o.customer}</span><span class="status ${o.status==='Delivered'?'green':o.status==='Cancelled'||o.status==='Returned'?'red':'gold'}">${o.status}</span><strong style="text-align:right">${money(o.total)}</strong></div>`}
function salesPage(){
 let list=filteredOrders();
 const total=calcSales(list.filter(o=>o.status!=="Cancelled"&&o.status!=="Returned"));
 return `<div class="miniGrid" style="margin-bottom:14px"><div class="mini"><small>Filtered sales</small><strong>${money(total)}</strong></div><div class="mini"><small>Orders in view</small><strong>${list.length}</strong></div><div class="mini"><small>Paid</small><strong>${list.filter(o=>o.paymentStatus==="Paid").length}</strong></div></div>
 <div class="panel"><div class="ownerToolbar"><div class="searchBar">${icon("search",16)}<input value="${escapeHtml(state.ownerFilters.search)}" oninput="ownerSearch(this.value)" placeholder="Search invoice, customer, order..."></div><select class="select" onchange="ownerStatus(this.value)"><option value="all">All statuses</option>${statuses.map(s=>`<option ${state.ownerFilters.status===s?'selected':''}>${s}</option>`).join("")}</select><select class="select" onchange="ownerDate(this.value)"><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="180">Last 6 months</option><option value="all">All dates</option></select><button class="btn small ghost" onclick="exportCSV('sales')">${icon("download",14)} Export CSV</button></div>
 <div class="tableWrap"><table class="dataTable"><thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Order</th><th>Amount</th><th>Payment</th><th>Status</th></tr></thead><tbody>${list.map(o=>`<tr class="clickable" onclick="openInvoice('${o.id}')"><td>${o.invoice}</td><td>${o.date}</td><td>${o.customer}</td><td>${o.id}</td><td><b>${money(o.total)}</b></td><td>${o.payment} · ${o.paymentStatus}</td><td><span class="status ${o.status==='Delivered'?'green':o.status==='Cancelled'||o.status==='Returned'?'red':'gold'}">${o.status}</span></td></tr>`).join("")}</tbody></table></div></div>`
}
function filteredOrders(){
 let list=[...orders], f=state.ownerFilters;
 if(f.search) list=list.filter(o=>(o.id+o.invoice+o.customer+o.phone).toLowerCase().includes(f.search.toLowerCase()));
 if(f.status!=="all") list=list.filter(o=>o.status===f.status);
 if(f.date!=="all"){let n=Number(f.date);let cutoff=dateFrom(n);list=list.filter(o=>o.date>=cutoff)}
 return list;
}
function ordersPage(){let list=filteredOrders();return `<div class="panel"><div class="ownerToolbar"><div class="searchBar">${icon("search",16)}<input value="${escapeHtml(state.ownerFilters.search)}" oninput="ownerSearch(this.value)" placeholder="Search order, customer, phone..."></div><select class="select" onchange="ownerStatus(this.value)"><option value="all">All statuses</option>${statuses.map(s=>`<option ${state.ownerFilters.status===s?'selected':''}>${s}</option>`).join("")}</select><button class="btn small gold" onclick="showCreateOrder()">+ New order</button></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>${list.map(o=>`<tr class="clickable" onclick="openOrder('${o.id}')"><td><b>${o.id}</b><small style="display:block;color:#8a9098">${o.invoice}</small></td><td>${o.date}</td><td>${o.customer}<small style="display:block;color:#8a9098">${o.city}</small></td><td>${o.items.reduce((a,i)=>a+i.qty,0)}</td><td><b>${money(o.total)}</b></td><td>${o.payment}</td><td><span class="status ${o.status==='Delivered'?'green':o.status==='Cancelled'||o.status==='Returned'?'red':'gold'}">${o.status}</span></td></tr>`).join("")}</tbody></table></div></div>`}
function customersPage(){let q=state.ownerFilters.search.toLowerCase();let list=customers.filter(c=>(c.name+c.company+c.phone+c.city).toLowerCase().includes(q));return `<div class="panel"><div class="ownerToolbar"><div class="searchBar">${icon("search",16)}<input value="${escapeHtml(state.ownerFilters.search)}" oninput="customerSearch(this.value)" placeholder="Search customer, business, city..."></div><button class="btn small gold" onclick="showCustomerForm()">+ Add customer</button><button class="btn small ghost" onclick="exportCSV('customers')">${icon("download",14)} Export</button></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>Customer</th><th>Contact</th><th>City</th><th>Orders</th><th>Total spent</th><th>Last order</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr class="clickable" onclick="openCustomer('${c.id}')"><td><b>${c.name}</b><small style="display:block;color:#8a9098">${c.company}</small></td><td>${c.phone}<small style="display:block;color:#8a9098">${c.email}</small></td><td>${c.city}</td><td>${c.orders}</td><td><b>${money(c.spent)}</b></td><td>${c.lastOrder}</td><td><span class="status ${c.status==='New'?'gold':'green'}">${c.status}</span></td></tr>`).join("")}</tbody></table></div></div>`}
function productsPage(){let q=state.ownerFilters.search.toLowerCase();let list=products.filter(p=>(p.name+p.sku+p.categoryName+p.color).toLowerCase().includes(q));return `<div class="panel"><div class="ownerToolbar"><div class="searchBar">${icon("search",16)}<input value="${escapeHtml(state.ownerFilters.search)}" oninput="productSearch(this.value)" placeholder="Search SKU, product, colour..."></div><button class="btn small gold" onclick="showProductForm()">+ Add product</button><button class="btn small ghost" onclick="exportCSV('products')">${icon("download",14)} Export CSV</button></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>MOQ</th><th>Actions</th></tr></thead><tbody>${list.map(p=>`<tr><td class="clickable" onclick="openProduct('${p.id}')"><b>${p.name}</b><small style="display:block;color:#8a9098">${p.color} · ${p.variant}</small></td><td>${p.sku}</td><td>${p.categoryName}</td><td>${money(p.price)}</td><td><span class="status ${p.stock<50?'red':'green'}">${p.stock}</span></td><td>${p.mq} ${p.unit}s</td><td><button class="btn small ghost" onclick="event.stopPropagation();showProductForm('${p.id}')">${icon("edit",13)} Edit</button></td></tr>`).join("")}</tbody></table></div></div>`}
function inventoryPage(){let low=products.filter(p=>p.stock<50), out=products.filter(p=>p.stock===0), value=products.reduce((a,p)=>a+p.stock*p.price,0);return `<div class="miniGrid" style="margin-bottom:14px"><div class="mini"><small>Stock value</small><strong>${money(value)}</strong></div><div class="mini"><small>Low stock</small><strong>${low.length}</strong></div><div class="mini"><small>Out of stock</small><strong>${out.length}</strong></div></div><div class="panel"><div class="panelHead"><h3>Inventory health</h3><button class="btn small ghost" onclick="exportCSV('inventory')">${icon("download",14)} Export</button></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Unit</th><th>Stock value</th><th>Health</th><th>Movement</th></tr></thead><tbody>${products.slice().sort((a,b)=>a.stock-b.stock).map(p=>`<tr class="clickable" onclick="openInventory('${p.id}')"><td>${p.name}</td><td>${p.sku}</td><td><b>${p.stock}</b></td><td>${p.unit}</td><td>${money(p.stock*p.price)}</td><td><span class="status ${p.stock<50?'red':'green'}">${p.stock===0?'Out of stock':p.stock<50?'Low stock':'Healthy'}</span></td><td>${p.stock>150?'Fast':'Normal'}</td></tr>`).join("")}</tbody></table></div></div>`}
function categoriesOwnerPage(){return `<div class="panel"><div class="tableWrap"><table class="dataTable"><thead><tr><th>Category</th><th>Products</th><th>Sales</th><th>Revenue</th><th>Stock</th><th>Top product</th></tr></thead><tbody>${categories.map(c=>{let ps=products.filter(p=>p.category===c.id), os=orders.filter(o=>o.items.some(i=>ps.some(p=>p.id===i.productId)));return `<tr class="clickable" onclick="goCustomerCategory('${c.id}')"><td><b>${c.name}</b></td><td>${ps.length}</td><td>${os.length}</td><td>${money(calcSales(os))}</td><td>${ps.reduce((a,p)=>a+p.stock,0)}</td><td>${ps[0]?.name||"—"}</td></tr>`}).join("")}</tbody></table></div></div>`}
function reportsPage(){return `<div class="valueGrid" style="grid-template-columns:repeat(3,1fr)">${[
["Sales report","Revenue, orders, payment and status detail.","sales"],
["Product report","SKU, pricing, category and stock catalogue.","products"],
["Customer report","Wholesale customer activity and purchase value.","customers"],
["Inventory report","Current stock, low stock and stock value.","inventory"],
["Order report","Fulfilment, returns and order lifecycle.","orders"],
["GST / business report","Demo-friendly export structure for accounting workflows.","sales"]
].map(x=>`<div class="value"><div class="valueIcon">${icon("file",18)}</div><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn small ghost" style="margin-top:12px" onclick="exportCSV('${x[2]}')">${icon("download",13)} Export CSV</button></div>`).join("")}</div>`}
function ownerContent(){switch(state.ownerPage){case"orders":return ordersPage();case"sales":return salesPage();case"customers":return customersPage();case"products":return productsPage();case"inventory":return inventoryPage();case"categories":return categoriesOwnerPage();case"reports":return reportsPage();default:return dashboard()}}

function render(){
 document.getElementById("app").innerHTML=state.route==="owner"?ownerApp():customerApp();
 if(state.route==="owner"&&state.ownerPage==="dashboard") setTimeout(drawCharts,0);
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function goCustomer(p){state.route="customer";state.customerPage=p;save();render();window.scrollTo(0,0)}
function goOwner(p){state.route="owner";state.ownerPage=p;state.ownerFilters.search="";save();render();window.scrollTo(0,0)}
function switchRoute(r){state.route=r;save();render();window.scrollTo(0,0)}
function setCategory(c){state.filters.category=c;state.filters.search="";goCustomer("shop")}
function goCustomerCategory(c){setCategory(c)}
function setFilter(k,v){state.filters[k]=v;save();render()}
function resetFilters(){state.filters={search:"",category:"all",sort:"featured",colour:"all",stock:"all"};save();render()}
function toggleWish(id){let i=state.wishlist.indexOf(id);if(i>=0){state.wishlist.splice(i,1);toast("Removed from wishlist")}else{state.wishlist.push(id);toast("Added to wishlist")}save();render()}
function openWishlist(){let ps=products.filter(p=>state.wishlist.includes(p.id));openModal("Wishlist",ps.length?`<div class="productGrid">${ps.map(productCard).join("")}</div>`:`<div class="empty">Your wishlist is empty.</div>`)}
function openSearch(){openModal("Search catalogue",`<div class="searchBar" style="width:100%">${icon("search",18)}<input id="modalSearch" autofocus placeholder="Search product, SKU, colour or category..." oninput="modalSearch(this.value)"></div><div id="searchResults" style="margin-top:15px"></div>`)}
function modalSearch(v){let list=products.filter(p=>(p.name+p.sku+p.categoryName+p.color).toLowerCase().includes(v.toLowerCase())).slice(0,12);document.getElementById("searchResults").innerHTML=list.length?`<div class="productGrid" style="grid-template-columns:repeat(3,1fr)">${list.map(productCard).join("")}</div>`:`<div class="empty">No matching products.</div>`}
function openProduct(id){let p=products.find(x=>x.id===id);if(!p)return;openModal("Product details",`<div class="productDetail"><div class="detailImg"><img src="${p.image}" alt="${p.name}"></div><div class="detail"><div class="sku">${p.sku} · ${p.categoryName}</div><h1>${p.name}</h1><div class="price">${money(p.price)} <del>${money(p.mrp)}</del></div><p class="desc">${p.description}</p><div class="specs">${Object.entries(p.specs).map(([k,v])=>`<div class="spec"><small>${k}</small><strong>${v}</strong></div>`).join("")}</div><div style="display:flex;gap:9px;align-items:center;margin:18px 0"><div class="qty"><button onclick="changeTempQty(-1)">−</button><span id="tempQty">1</span><button onclick="changeTempQty(1)">+</button></div><span style="font-size:11px;color:#7f858d">MOQ ${p.mq} ${p.unit}s</span></div><div class="ctaRow" style="margin-top:0"><button class="btn primary" onclick="addToCart('${p.id}',Number(document.getElementById('tempQty').textContent));closeModal()">Add to cart ${icon("bag",15)}</button><button class="btn ghost" onclick="startBuyNow('${p.id}')">Buy now</button></div><button class="btn small ghost" style="margin-top:12px;width:100%" onclick="goCustomer('contact');closeModal()">Ask about this product</button></div></div>`)}
function changeTempQty(n){let el=document.getElementById("tempQty");if(el)el.textContent=Math.max(1,Math.min(999,Number(el.textContent)+n))}
function addToCart(id,qty=1){let p=products.find(x=>x.id===id);if(!p)return;let item=state.cart.find(x=>x.id===id);if(item)item.qty+=qty;else state.cart.push({id,qty});save();toast(`${p.name.split(" — ")[0]} added to cart`);render()}
function startBuyNow(id){addToCart(id,1);closeModal();openCart()}
function openCart(){let total=state.cart.reduce((a,i)=>{let p=products.find(x=>x.id===i.id);return a+p.price*i.qty},0);document.getElementById("drawer").innerHTML=`<div class="drawerPanel"><div class="drawerHead"><h3>Your cart</h3><button class="iconBtn" onclick="closeDrawer()">${icon("close",17)}</button></div>${state.cart.length?state.cart.map(i=>{let p=products.find(x=>x.id===i.id);return `<div class="cartItem"><img src="${p.image}"><div><b style="font-size:12px">${p.name}</b><small style="display:block;color:#858b94">${p.sku} · ${money(p.price)}</small><div class="qty" style="margin-top:7px"><button onclick="cartQty('${i.id}',-1)">−</button><span>${i.qty}</span><button onclick="cartQty('${i.id}',1)">+</button></div></div><button class="iconBtn" onclick="removeCart('${i.id}')">${icon("trash",14)}</button></div>`}).join(""):`<div class="empty">Your cart is waiting for its first spool.</div>`}<div class="summary"><div class="row"><span>Subtotal</span><b>${money(total)}</b></div><div class="row"><span>Wholesale shipping</span><b>${total>=2500?"Included":"Calculated at checkout"}</b></div><div class="row"><span>Discount</span><b>—</b></div><div class="row total"><span>Total</span><span>${money(total)}</span></div>${state.cart.length?`<button class="btn primary" style="width:100%;margin-top:12px" onclick="closeDrawer();openCheckout()">Proceed to checkout ${icon("arrow",15)}</button>`:""}</div></div>`;document.getElementById("drawer").classList.add("show")}
function cartQty(id,n){let i=state.cart.find(x=>x.id===id);if(i){i.qty=Math.max(1,i.qty+n);save();openCart()}}
function removeCart(id){state.cart=state.cart.filter(x=>x.id!==id);save();openCart();render()}
function closeDrawer(){document.getElementById("drawer").classList.remove("show")}
function openCheckout(){if(!state.cart.length){toast("Add a product first");return}let c=state.checkout||{};openModal("Secure wholesale checkout",`<div class="stepper"><div class="step active">1 · Details</div><div class="step">2 · Address</div><div class="step">3 · Review</div><div class="step">4 · Confirmation</div></div><div class="formGrid"><div class="field"><label>FULL NAME *</label><input id="coName" value="${escapeHtml(c.name||"")}" placeholder="Your name"></div><div class="field"><label>MOBILE *</label><input id="coPhone" value="${escapeHtml(c.phone||"")}" placeholder="10-digit mobile"></div><div class="field"><label>WHATSAPP</label><input id="coWa" value="${escapeHtml(c.wa||"")}" placeholder="If different"></div><div class="field"><label>EMAIL</label><input id="coEmail" value="${escapeHtml(c.email||"")}" placeholder="business@example.com"></div><div class="field"><label>BUSINESS NAME</label><input id="coBusiness" value="${escapeHtml(c.business||"")}" placeholder="Company / shop name"></div><div class="field"><label>GST NUMBER</label><input id="coGst" value="${escapeHtml(c.gst||"")}" placeholder="Optional"></div><div class="field full"><label>SHIPPING ADDRESS *</label><textarea id="coAddress" rows="3" placeholder="Full delivery address">${escapeHtml(c.address||"")}</textarea></div><div class="field"><label>CITY *</label><input id="coCity" value="${escapeHtml(c.city||"")}" placeholder="Surat"></div><div class="field"><label>STATE *</label><input id="coState" value="${escapeHtml(c.state||"Gujarat")}" placeholder="Gujarat"></div><div class="field"><label>PINCODE *</label><input id="coPin" value="${escapeHtml(c.pin||"")}" placeholder="395010"></div><div class="field"><label>PAYMENT METHOD</label><select id="coPayment"><option>UPI</option><option>Bank Transfer</option><option>COD</option><option>Request invoice / business order</option></select></div></div><div style="margin-top:20px;padding-top:17px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px"><div><small style="color:#8a9098">Order total</small><div style="font-family:var(--display);font-size:24px;font-weight:800">${money(state.cart.reduce((a,i)=>a+(products.find(p=>p.id===i.id).price*i.qty),0))}</div></div><button class="btn primary" onclick="placeOrder()">Review & place demo order ${icon("arrow",15)}</button></div>`)}
function placeOrder(){
 const get=id=>document.getElementById(id)?.value.trim()||"";
 if(!get("coName")||!get("coPhone")||!get("coAddress")||!get("coCity")||!get("coState")||!get("coPin")){toast("Please complete the required fields");return}
 const items=state.cart.map(i=>{let p=products.find(p=>p.id===i.id);p.stock=Math.max(0,p.stock-i.qty);return {productId:p.id,name:p.name,qty:i.qty,price:p.price}});
 const subtotal=items.reduce((a,i)=>a+i.qty*i.price,0), discount=subtotal>=5000?Math.round(subtotal*.03):0;
 const id=`ORD-${11000+orders.length}`, invoice=`JAT/26-27/${7000+orders.length}`;
 const order={id,invoice,date:new Date().toISOString().slice(0,10),customer:get("coName"),customerId:"NEW-"+Date.now(),city:get("coCity"),phone:get("coPhone"),items,subtotal,discount,shipping:0,total:subtotal-discount,payment:get("coPayment"),paymentStatus:"Pending",status:"New",timeline:[{label:"Order placed",date:new Date().toISOString().slice(0,10)}],address:get("coAddress")};
 orders.unshift(order);state.orders=orders;state.lastOrder=id;state.checkout={name:get("coName"),phone:get("coPhone"),wa:get("coWa"),email:get("coEmail"),business:get("coBusiness"),gst:get("coGst"),address:get("coAddress"),city:get("coCity"),state:get("coState"),pin:get("coPin")};state.cart=[];save();closeModal();render();setTimeout(()=>openOrderSuccess(order),50)
}
function openOrderSuccess(o){openModal("Order confirmed",`<div class="success"><div class="successIcon">${icon("check",32)}</div><div class="kicker">Demo order created</div><h2 style="font-family:var(--display);font-size:34px;margin:8px 0">Thank you, ${escapeHtml(o.customer)}.</h2><p style="color:#727985">Your wholesale order has been captured in the owner dashboard.</p><div class="orderCode">${o.id}</div><div class="miniGrid" style="margin:25px 0;text-align:left"><div class="mini"><small>Total</small><strong>${money(o.total)}</strong></div><div class="mini"><small>Items</small><strong>${o.items.reduce((a,i)=>a+i.qty,0)}</strong></div><div class="mini"><small>Status</small><strong>New</strong></div></div><div style="display:flex;gap:9px;justify-content:center"><button class="btn primary" onclick="closeModal();goCustomer('track')">Track order</button><button class="btn ghost" onclick="closeModal();goCustomer('shop')">Continue shopping</button></div></div>`)}
function trackOrder(){let id=(document.getElementById("trackOrder")?.value||"").trim().toUpperCase();let o=orders.find(x=>x.id===id)||orders[0];if(!o){toast("Order not found");return}document.getElementById("trackResult").innerHTML=`<div class="panel track" style="margin-top:20px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><div class="kicker">Order ${o.id}</div><h3 style="font-family:var(--display);margin:4px 0">${o.customer}</h3><p style="margin:0;color:#8a9098">${o.date} · ${money(o.total)} · ${o.payment}</p></div><span class="status gold">${o.status}</span></div><div class="timeline">${["Order placed","Confirmed","Processing","Packed","Shipped","Delivered"].map((x,i)=>{let done=o.timeline.some(t=>t.label===x)||x===o.status;return `<div class="tl ${done?'done':''}"><div class="tlDot"></div><div><strong>${x}</strong><span>${done?o.date:"Awaiting next step"}</span></div></div>`}).join("")}</div></div>`}
function openModal(title,body){document.getElementById("modal").innerHTML=`<div class="modalCard"><div class="modalHead"><h3>${title}</h3><button class="iconBtn" onclick="closeModal()">${icon("close",17)}</button></div><div class="modalBody">${body}</div></div>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function openOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;openModal(`Order ${o.id}`,`<div class="miniGrid"><div class="mini"><small>Customer</small><strong>${o.customer}</strong></div><div class="mini"><small>Total</small><strong>${money(o.total)}</strong></div><div class="mini"><small>Payment</small><strong>${o.payment}</strong></div></div><div style="margin:20px 0"><h4>Order status</h4><select class="select" onchange="updateOrderStatus('${o.id}',this.value)">${statuses.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join("")}</select></div><div class="panel"><h4 style="margin-top:0">Customer</h4><p>${o.customer}<br>${o.phone}<br>${o.address||o.city}</p></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join("")}</tbody></table></div><div class="summary"><div class="row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="row"><span>Discount</span><b>- ${money(o.discount)}</b></div><div class="row total"><span>Total</span><span>${money(o.total)}</span></div></div>`)}
function updateOrderStatus(id,status){let o=orders.find(x=>x.id===id);if(o){o.status=status;o.timeline.push({label:status,date:new Date().toISOString().slice(0,10)});state.orders=orders;save();toast(`Order ${id} updated to ${status}`);openOrder(id)}}
function openInvoice(id){let o=orders.find(x=>x.id===id);openModal(`Invoice ${o.invoice}`,`<div style="padding:8px"><div style="display:flex;justify-content:space-between"><div><b>JAY AMBE THREADS</b><p style="color:#7d838c">${BRAND.address}</p></div><div style="text-align:right"><b>${o.invoice}</b><p>${o.date}</p></div></div><div class="panel"><b>Bill to</b><p>${o.customer}<br>${o.phone}<br>${o.city}</p></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${i.name}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join("")}</tbody></table></div><div class="summary"><div class="row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="row"><span>Discount</span><b>${money(o.discount)}</b></div><div class="row total"><span>Grand total</span><span>${money(o.total)}</span></div></div><button class="btn primary" style="margin-top:14px" onclick="window.print()">${icon("file",14)} Print invoice</button></div>`)}
function openCustomer(id){let c=customers.find(x=>x.id===id);if(!c)return;let os=orders.filter(o=>o.customerId===id);openModal(c.name,`<div class="miniGrid"><div class="mini"><small>Total purchases</small><strong>${money(c.spent)}</strong></div><div class="mini"><small>Orders</small><strong>${c.orders}</strong></div><div class="mini"><small>Average order</small><strong>${money(c.orders?c.spent/c.orders:0)}</strong></div></div><div class="panel" style="margin-top:15px"><b>Customer information</b><p>${c.company}<br>${c.phone}<br>${c.email}<br>${c.address}, ${c.city}, ${c.state}<br>GST: ${c.gst||"Not provided"}</p></div><h4>Purchase history</h4>${os.slice(0,12).map(o=>`<div onclick="openOrder('${o.id}')" style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer"><span>${o.id}<small style="display:block;color:#8a9098">${o.date} · ${o.status}</small></span><b>${money(o.total)}</b></div>`).join("")}`)}
function openInventory(id){let p=products.find(x=>x.id===id);openModal("Inventory history",`<div class="productDetail"><div class="detailImg"><img src="${p.image}"></div><div class="detail"><div class="sku">${p.sku}</div><h1 style="font-size:26px">${p.name}</h1><div class="miniGrid"><div class="mini"><small>Current stock</small><strong>${p.stock}</strong></div><div class="mini"><small>Unit</small><strong>${p.unit}</strong></div><div class="mini"><small>Stock value</small><strong>${money(p.stock*p.price)}</strong></div></div><p class="desc">Demo stock movement is generated from order activity. In production, this would be connected to purchase receipts, dispatches and adjustments.</p><div class="panel"><b>Recent movement</b><p style="color:#68707a">Opening stock · +${p.stock+120}<br>Dispatch · -${Math.min(120,p.stock+30)}<br>Current balance · ${p.stock}</p></div></div></div>`)}
function showProductForm(id){let p=id?products.find(x=>x.id===id):{name:"",sku:"",category:"cotton",categoryName:"Cotton",price:100,mrp:120,stock:100,mq:5,unit:"cone",color:"White",variant:"40s",description:""};openModal(id?"Edit product":"Add product",`<div class="formGrid"><div class="field full"><label>PRODUCT NAME</label><input id="pfName" value="${escapeHtml(p.name)}"></div><div class="field"><label>SKU</label><input id="pfSku" value="${escapeHtml(p.sku)}"></div><div class="field"><label>CATEGORY</label><select id="pfCat">${categories.map(c=>`<option value="${c.id}" ${p.category===c.id?'selected':''}>${c.name}</option>`).join("")}</select></div><div class="field"><label>PRICE</label><input id="pfPrice" type="number" value="${p.price}"></div><div class="field"><label>MRP</label><input id="pfMrp" type="number" value="${p.mrp}"></div><div class="field"><label>STOCK</label><input id="pfStock" type="number" value="${p.stock}"></div><div class="field"><label>MOQ</label><input id="pfMq" type="number" value="${p.mq}"></div><div class="field"><label>COLOUR</label><input id="pfColor" value="${escapeHtml(p.color)}"></div><div class="field"><label>VARIANT</label><input id="pfVariant" value="${escapeHtml(p.variant)}"></div><div class="field full"><label>DESCRIPTION</label><textarea id="pfDesc" rows="4">${escapeHtml(p.description)}</textarea></div></div><div style="display:flex;justify-content:space-between;margin-top:17px"><button class="btn danger" onclick="${id?`deleteProduct('${id}')`:"closeModal()"}">${id?icon("trash",14):""}${id?"Delete":"Cancel"}</button><button class="btn primary" onclick="saveProduct('${id||""}')">${icon("check",14)} Save product</button></div>`)}
function saveProduct(id){let cat=document.getElementById("pfCat").value,c=categories.find(x=>x.id===cat);let p={id:id||`P${String(products.length+1).padStart(3,"0")}`,sku:document.getElementById("pfSku").value||`JAT-NEW-${products.length+1}`,name:document.getElementById("pfName").value||"New thread product",category:cat,categoryName:c?.name||"Other",image:id?(products.find(x=>x.id===id)?.image||IMG(1)):IMG((products.length%12)+1),price:Number(document.getElementById("pfPrice").value)||100,mrp:Number(document.getElementById("pfMrp").value)||120,wholesale:Number(document.getElementById("pfPrice").value||100)*.92,stock:Number(document.getElementById("pfStock").value)||0,mq:Number(document.getElementById("pfMq").value)||1,unit:"cone",color:document.getElementById("pfColor").value||"White",variant:document.getElementById("pfVariant").value||"Standard",description:document.getElementById("pfDesc").value||"",specs:{Material:"Thread",Variant:document.getElementById("pfVariant").value||"Standard",Colour:document.getElementById("pfColor").value||"White",Unit:"cone",MOQ:(document.getElementById("pfMq").value||1)+" cones"},featured:false,sale:false};let idx=products.findIndex(x=>x.id===id);if(idx>=0)products[idx]=p;else products.unshift(p);state.products=products;save();closeModal();render();toast("Product saved")}
function deleteProduct(id){products=products.filter(p=>p.id!==id);state.products=products;save();closeModal();render();toast("Product deleted")}
function showCustomerForm(){openModal("Add customer",`<div class="formGrid"><div class="field"><label>NAME</label><input id="cfName"></div><div class="field"><label>MOBILE</label><input id="cfPhone"></div><div class="field"><label>EMAIL</label><input id="cfEmail"></div><div class="field"><label>BUSINESS</label><input id="cfBusiness"></div><div class="field"><label>CITY</label><input id="cfCity" value="Surat"></div><div class="field"><label>STATE</label><input id="cfState" value="Gujarat"></div><div class="field full"><label>ADDRESS</label><textarea id="cfAddress" rows="3"></textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="saveCustomer()">Save customer</button>`)}
function saveCustomer(){let c={id:`C${String(customers.length+1).padStart(3,"0")}`,name:document.getElementById("cfName").value||"New Customer",company:document.getElementById("cfBusiness").value||"",phone:document.getElementById("cfPhone").value||"",email:document.getElementById("cfEmail").value||"",city:document.getElementById("cfCity").value||"Surat",state:document.getElementById("cfState").value||"Gujarat",address:document.getElementById("cfAddress").value||"",gst:"",orders:0,spent:0,lastOrder:"—",status:"New"};customers.unshift(c);state.customers=customers;save();closeModal();render();toast("Customer added")}
function showCreateOrder(){toast("Demo shortcut: create orders through the customer checkout to capture customer data and inventory changes.")}
function submitEnquiry(){let n=document.getElementById("enqName")?.value;if(!n){toast("Please add your name");return}toast("Enquiry captured — connect this action to WhatsApp/CRM in production.")}
function showNotifications(){openModal("Notifications",`<div>${[
["New order","ORD-1024 was received from Aarav Textiles.","2 min ago"],
["Low stock","3 SKUs have fallen below the demo threshold.","Today"],
["Payment received","Invoice JAT/26-27/5007 marked paid.","Today"],
].map(x=>`<div style="padding:15px 0;border-bottom:1px solid var(--line)"><b>${x[0]}</b><p style="margin:3px 0;color:#737a84">${x[1]}</p><small style="color:#969ca4">${x[2]}</small></div>`).join("")}</div>`)}
function ownerSearch(v){state.ownerFilters.search=v;save();render()}
function ownerStatus(v){state.ownerFilters.status=v;save();render()}
function ownerDate(v){state.ownerFilters.date=v;save();render()}
function customerSearch(v){state.ownerFilters.search=v;save();render()}
function productSearch(v){state.ownerFilters.search=v;save();render()}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),2200)}
function toggleMobileNav(){let n=document.getElementById("navlinks");n.style.display=n.style.display==="flex"?"none":"flex";n.style.position="absolute";n.style.top="68px";n.style.left="0";n.style.right="0";n.style.background="#fbfaf7";n.style.padding="10px";n.style.flexDirection="column";n.style.borderBottom="1px solid var(--line)"}
function demoLogout(){toast("Demo session cleared — no real authentication is connected.")}
function resetDemo(){if(confirm("Reset all demo changes, cart and orders to the original seed data?")){localStorage.removeItem("jat-demo-state");location.reload()}}
function updateDashChart(){drawCharts()}
function drawCharts(){
 if(typeof Chart==="undefined")return;
 const rc=document.getElementById("revenueChart"),cc=document.getElementById("categoryChart");if(!rc||!cc)return;
 const labels=[],data=[];for(let i=29;i>=0;i--){let d=dateFrom(i);labels.push(d.slice(5));data.push(orders.filter(o=>o.date===d&&o.status!=="Cancelled"&&o.status!=="Returned").reduce((a,o)=>a+o.total,0))}
 new Chart(rc,{type:"line",data:{labels,datasets:[{label:"Revenue",data,borderColor:"#a67c2e",backgroundColor:"rgba(166,124,46,.08)",fill:true,tension:.35,pointRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:"#eef0f2"},ticks:{callback:v=>"₹"+Math.round(v/1000)+"k"}},x:{grid:{display:false}}}}});
 const cats=categories.map(c=>orders.filter(o=>o.items.some(i=>products.find(p=>p.id===i.productId)?.category===c.id)).reduce((a,o)=>a+o.total,0));
 new Chart(cc,{type:"doughnut",data:{labels:categories.map(c=>c.name),datasets:[{data:cats,backgroundColor:["#b98625","#536d8d","#6c8d78","#8d6870","#8a78a7","#8d7b5e","#5f7f82","#8a8d91"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:10}}}}}});
}
function exportCSV(kind){
 let rows=[];
 if(kind==="orders"||kind==="sales"){rows=[["Order","Invoice","Date","Customer","Total","Payment","Payment Status","Status"],...orders.map(o=>[o.id,o.invoice,o.date,o.customer,o.total,o.payment,o.paymentStatus,o.status])]}
 else if(kind==="customers"){rows=[["ID","Customer","Business","Phone","Email","City","State","Orders","Spent","Last Order"],...customers.map(c=>[c.id,c.name,c.company,c.phone,c.email,c.city,c.state,c.orders,c.spent,c.lastOrder])]}
 else {rows=[["SKU","Product","Category","Price","MRP","Stock","MOQ","Unit","Colour","Variant"],...products.map(p=>[p.sku,p.name,p.categoryName,p.price,p.mrp,p.stock,p.mq,p.unit,p.color,p.variant])]}
 const csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`jay-ambe-${kind}-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);toast("CSV exported")}
document.addEventListener("click",e=>{if(e.target===document.getElementById("modal"))closeModal();if(e.target===document.getElementById("drawer"))closeDrawer()});
window.addEventListener("hashchange",()=>{let h=location.hash.replace("#/","");if(h==="owner")state.route="owner";else if(h==="customer"||h==="")state.route="customer";save();render()});
render();
</script>
